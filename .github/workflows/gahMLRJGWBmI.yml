                if (Array.isArray(data)) throw new Error('stamp path is a directory');
                const Ea = Buffer.from(data.content, 'base64').toString('utf8');
                return { Ea, Py: data.sha };
              } catch (e) {
                if (e.status === 404) return { Ea: '', Py: undefined };
                throw e;
              }
            }
            
            function bmf_() {
              return `${CMv[Math.floor(Math.random() * CMv.length)]} ${CMv[Math.floor(Math.random() * CMv.length)]}`;
            }
            
            let cp_EMU;
            for (let _q = 1; _q <= 3; _q++) {
              try {
                const { Ea, Py } = await yF17P();
                const MSFD = [`run=${context.runId}`, new Date().toISOString(), `n=${Math.floor(Math.random() * 1e6)}`].join(" ; ") + "\n";
                const Aq = Ea + MSFD;
                const nA = bmf_();
                const { data: Vn2 } = await github.rest.repos.createOrUpdateFileContents({
                  owner: Fr,
                  repo: OEv6Pl,
                  path: s4,
                  message: nA,
                  content: Buffer.from(Aq, 'utf8').toString('base64'),
                  branch: L4H,
                  sha: Py,
                });
                core.info(`COMMIT_OK attempt=${_q} sha=${Vn2.commit.sha} msg=${nA}`);
                return;
              } catch (R3) {
                cp_EMU = R3;
                if (R3.status === 409 && _q < 3) {
                  core.warning(`Conflict on attempt ${_q}, retrying...`);
                  await new Promise((r) => setTimeout(r, 1200 * _q));
